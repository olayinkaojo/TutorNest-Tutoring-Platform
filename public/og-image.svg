<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#625d9c"/>

  <!-- Subtle circle decorations -->
  <circle cx="100" cy="100" r="200" fill="#7169a9" opacity="0.4"/>
  <circle cx="1150" cy="560" r="250" fill="#5a548f" opacity="0.5"/>
  <circle cx="1100" cy="80" r="120" fill="#7169a9" opacity="0.3"/>

  <!-- White card area -->
  <rect x="80" y="180" width="1040" height="270" rx="20" fill="white" opacity="0.1"/>

  <!-- TN Logo circle -->
  <circle cx="600" cy="140" r="52" fill="white" opacity="0.2"/>
  <text x="600" y="155" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">TN</text>

  <!-- Main title -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-1">TutorNest</text>

  <!-- Tagline -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" opacity="0.9">Find Your Perfect Tutor</text>

  <!-- Bottom description -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" opacity="0.7">Connect with qualified tutors · Book sessions · Track progress</text>

  <!-- URL hint -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.5">tutornest.vercel.app</text>
</svg>
