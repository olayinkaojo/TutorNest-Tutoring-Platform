opencollection: 1.0.0

info:
  name: TutorNest API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: apikey
      value: "{{anonKey}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
