<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix User Role - Knowledge Fons Academy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #ffffff 50%, #f0fdf4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #625d9c;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #625d9c;
            box-shadow: 0 0 0 3px rgba(98, 93, 156, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px 24px;
            background: #625d9c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #4e4880;
        }
        
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert.show {
            display: block;
        }
        
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        
        .alert-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        
        .note {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 20px;
        }
        
        .note-title {
            color: #1e40af;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .note-text {
            color: #1e3a8a;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Fix User Role</h1>
        <p class="subtitle">Correct user role assignment for accounts with incorrect roles</p>
        
        <div id="errorAlert" class="alert alert-error"></div>
        <div id="successAlert" class="alert alert-success"></div>
        
        <form id="fixRoleForm">
            <div class="form-group">
                <label for="email">User Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="meetrejoiceali@gmail.com" 
                    required
                    value="meetrejoiceali@gmail.com"
                >
            </div>
            
            <div class="form-group">
                <label for="role">Correct Role</label>
                <select id="role" required>
                    <option value="">Select role...</option>
                    <option value="parent" selected>Parent</option>
                    <option value="tutor">Tutor</option>
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn">Fix User Role</button>
        </form>
        
        <div class="note">
            <div class="note-title">📝 Note:</div>
            <div class="note-text">
                This will update the user's role and delete their old role-specific profile.
                After fixing, the user should sign out and sign in again to see the changes.
            </div>
        </div>
    </div>
    
    <script>
        // Get project ID from current URL or set it manually
        const PROJECT_ID = window.location.hostname.split('.')[0];
        const API_URL = `https://${PROJECT_ID}.supabase.co/functions/v1/make-server-cbd74580/admin/fix-user-role`;
        // Note: You'll need to replace PUBLIC_ANON_KEY with your actual key
        const PUBLIC_ANON_KEY = 'YOUR_PUBLIC_ANON_KEY_HERE';
        
        const form = document.getElementById('fixRoleForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        
        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.classList.add('show');
            successAlert.classList.remove('show');
        }
        
        function showSuccess(message) {
            successAlert.textContent = message;
            successAlert.classList.add('show');
            errorAlert.classList.remove('show');
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;
            
            if (!email || !role) {
                showError('Please provide both email and role');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Fixing...';
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${PUBLIC_ANON_KEY}`
                    },
                    body: JSON.stringify({
                        userEmail: email,
                        correctRole: role
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showSuccess(data.message || 'User role fixed successfully! Please sign out and sign in again.');
                    form.reset();
                } else {
                    showError(data.error || 'Failed to fix user role');
                }
            } catch (err) {
                console.error('Error:', err);
                showError('Network error: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Fix User Role';
            }
        });
    </script>
</body>
</html>
